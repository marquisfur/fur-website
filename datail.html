<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail | Marquis Fur</title>
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .detail-wrap{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:40px;
            margin:40px auto;
        }
        .gallery-main{
            width:100%;
            border-radius:8px;
            cursor:pointer;
        }
        .thumb-list{
            display:flex;
            gap:12px;
            margin-top:16px;
        }
        .thumb{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:4px;
            cursor:pointer;
            opacity:0.7;
        }
        .thumb.active{opacity:1;}
        .detail-info h2{margin-top:0;}
        .detail-info p{line-height:1.7;}
        .detail-info table{width:100%;margin-top:20px;border-collapse:collapse;}
        .detail-info td{padding:10px;border-bottom:1px solid #eee;}
        @media (max-width:768px){
            .detail-wrap{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
    <nav class="container">
        <a href="index.html" class="logo">Marquis Fur</a>
        <div class="nav-menu">
            <a href="index.html" class="en">Home</a>
            <a href="index.html" class="cn">首页</a>
            <a href="products.html" class="en active">Products</a>
            <a href="products.html" class="cn active">产品</a>
            <a href="about.html" class="en">About Us</a>
            <a href="about.html" class="cn">关于我们</a>
            <a href="contact.html" class="en">Contact</a>
            <a href="contact.html" class="cn">联系我们</a>
        </div>
        <div class="lang-switch">
            <button id="btnEn" class="active">EN</button>
            <button id="btnCn">中文</button>
        </div>
    </nav>

    <section class="container">
        <div class="detail-wrap">
            <div class="gallery-box">
                <img id="mainImg" class="gallery-main" src="" alt="Product" onclick="openLightbox(this.src)">
                <div class="thumb-list" id="thumbBox"></div>
            </div>
            <div class="detail-info">
                <h2 class="en" id="titleEn"></h2>
                <h2 class="cn" id="titleCn"></h2>
                <p class="en" id="descEn"></p>
                <p class="cn" id="descCn"></p>
                <table>
                    <tbody>
                        <tr>
                            <td class="en">Material</td>
                            <td class="cn">材质</td>
                            <td class="en" id="matEn"></td>
                            <td class="cn" id="matCn"></td>
                        </tr>
                        <tr>
                            <td class="en">Size</td>
                            <td class="cn">尺码</td>
                            <td class="en" id="sizeEn"></td>
                            <td class="cn" id="sizeCn"></td>
                        </tr>
                        <tr>
                            <td class="en">MOQ</td>
                            <td class="cn">起订量</td>
                            <td class="en" id="moqEn"></td>
                            <td class="cn" id="moqCn"></td>
                        </tr>
                        <tr>
                            <td class="en">Custom</td>
                            <td class="cn">定制</td>
                            <td class="en" id="customEn"></td>
                            <td class="cn" id="customCn"></td>
                        </tr>
                    </tbody>
                </table>
                <div style="margin-top:30px;">
                    <a href="contact.html" class="btn en">Inquire Now</a>
                    <a href="contact.html" class="btn cn">立即咨询</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p class="en">©2026 Marquis Fur. All rights reserved.</p>
        <p class="cn">©2026 Marquis Fur 版权所有</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeLightbox()">×</span>
        <img id="light-img" src="" alt="preview">
    </div>

<script>
// 双语切换
const btnEn = document.getElementById("btnEn");
const btnCn = document.getElementById("btnCn");
const enDom = document.querySelectorAll(".en");
const cnDom = document.querySelectorAll(".cn");

btnEn.onclick = () => {
    enDom.forEach(item => item.style.display = "block");
    cnDom.forEach(item => item.style.display = "none");
    btnEn.classList.add("active");
    btnCn.classList.remove("active");
};
btnCn.onclick = () => {
    enDom.forEach(item => item.style.display = "none");
    cnDom.forEach(item => item.style.display = "block");
    btnEn.classList.remove("active");
    btnCn.classList.add("active");
};

// 灯箱
function openLightbox(imgSrc){
    document.getElementById("light-img").src = imgSrc;
    document.getElementById("lightbox").classList.add("show");
    document.body.style.overflow = "hidden";
}
function closeLightbox(){
    document.getElementById("lightbox").classList.remove("show");
    document.body.style.overflow = "";
}
document.getElementById("lightbox").addEventListener("click", function(e){
    if(e.target === this) closeLightbox();
});

// 解析 frontmatter
function parseFrontmatter(rawMd){
    const match = rawMd.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if(!match) return null;
    const fmText = match[1];
    const data = {};
    const lines = fmText.split("\n");
    lines.forEach(line=>{
        const kv = line.split(/:\s+/);
        if(kv.length >= 2){
            const key = kv[0].trim();
            const val = kv.slice(1).join(":").trim();
            if(val.startsWith("[")){
                try{
                    data[key] = JSON.parse(val.replace(/'/g,'"'));
                }catch(e){
                    data[key] = val;
                }
            }else{
                data[key] = val;
            }
        }
    });
    return data;
}

// 获取url参数
function getUrlParam(name){
    const params = new URLSearchParams(location.search);
    return params.get(name);
}

async function loadProduct(pid){
    try{
        const res = await fetch(`content/products/${pid}.md`);
        if(!res.ok){
            document.body.innerHTML="<div class='container'><h2>Product not found</h2><a href='products.html'>Back to Products</a></div>";
            return;
        }
        const raw = await res.text();
        const item = parseFrontmatter(raw);
        if(!item){
            document.body.innerHTML="<div class='container'><h2>Product parse error</h2><a href='products.html'>Back to Products</a></div>";
            return;
        }

        document.getElementById("titleEn").innerText = item.titleEn;
        document.getElementById("titleCn").innerText = item.titleCn;
        document.getElementById("descEn").innerText = item.descEn;
        document.getElementById("descCn").innerText = item.descCn;
        document.getElementById("matEn").innerText = item.matEn;
        document.getElementById("matCn").innerText = item.matCn;
        document.getElementById("sizeEn").innerText = item.sizeEn;
        document.getElementById("sizeCn").innerText = item.sizeCn;
        document.getElementById("moqEn").innerText = item.moqEn;
        document.getElementById("moqCn").innerText = item.moqCn;
        document.getElementById("customEn").innerText = item.customEn;
        document.getElementById("customCn").innerText = item.customCn;

        const mainImg = document.getElementById("mainImg");
        const thumbBox = document.getElementById("thumbBox");
        thumbBox.innerHTML = "";
        mainImg.src = item.images[0];
        item.images.forEach((src,idx)=>{
            const thumb = document.createElement("img");
            thumb.className = "thumb"+(idx===0?" active":"");
            thumb.src = src;
            thumb.onclick = ()=>{
                mainImg.src = src;
                document.querySelectorAll(".thumb").forEach(t=>t.classList.remove("active"));
                thumb.classList.add("active");
            }
            thumbBox.appendChild(thumb);
        })
    }catch(err){
        console.error(err);
    }
}

const pid = getUrlParam("id");
if(pid) loadProduct(pid);
</script>
</body>
</html>
